[package]
name = "holdmybeer-cli"
version = "0.3.4"
edition = "2024"
authors = ["jabberwock"]
description = "Hold My Beer's API server for inter-process communication between AI agents."
license-file = "LICENSE"

[[bin]]
name = "collab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# rustls instead of the default native-tls, so the CLI builds without the
# system's OpenSSL headers (a fresh Raspberry Pi or Steam Deck has none).
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
libc = "0.2"
serde_yaml = "0.9"
regex = "1.10"
shlex = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
holdmybeer-server = { path = "../collab-server" }
axum = "0.7"
# SQLite is a local file, so sqlx needs no TLS backend. Asking for one
# (the old "runtime-tokio-native-tls") made every build require the
# system's OpenSSL headers.
# Pinned to an unreleased sqlx commit on purpose. RUSTSEC-2026-0459 is fixed
# in libsqlite3-sys 0.39, and every released sqlx (up to 0.9.0) refuses
# anything from 0.38 up. Upstream main already allows it. Replace this with
# a plain version as soon as sqlx publishes a release that does too; until
# then these crates cannot be published to crates.io.
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "987b8c5a74b6da8b71da6b5549925a7f6e59aac9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
